version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opamp-postgres
    environment:
      POSTGRES_USER: opamp
      POSTGRES_PASSWORD: opamp_password
      POSTGRES_DB: opamp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opamp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opamp-network
    # Podman-specific: run as specific user
    userns_mode: keep-id
    security_opt:
      - label=disable

  opamp-server:
    image: local/opamp-server:latest
    container_name: opamp-server    
    command: ["/usr/local/bin/opamp-server"]       
    ports:
      - "4321:4321"  # UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4321/"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - opamp-network
    # Podman-specific
    userns_mode: keep-id
    security_opt:
      - label=disable

  backend:
    image: local/opamp-backend:latest
    container_name: opamp-backend
    depends_on:
      postgres:
        condition: service_healthy
      opamp-server:
        condition: service_healthy
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://opamp:opamp_password@postgres:5432/opamp_db
      # OpAMP Server
      - OPAMP_SERVER_URL=http://opamp-server:4321
      - OPAMP_SYNC_INTERVAL_SECONDS=60
      # Performance Settings (for 10k+ agents)
      - OPAMP_SYNC_BATCH_SIZE=100
      - OPAMP_SYNC_MAX_WORKERS=10
      - OPAMP_DB_BULK_SIZE=500
      # JWT Security - CHANGE IN PRODUCTION!
      - SECRET_KEY=change-this-secret-key-in-production-use-openssl-rand-hex-32
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      # Application
      - API_V1_PREFIX=/api/v1
      - PROJECT_NAME=OpAMP Backend API
      - DEBUG=false
      # Log configuration (override .env if needed)
      - LOG_LEVEL=${LOG_LEVEL:-INFO}              # DEBUG, INFO, WARNING, ERROR, CRITICAL
      - LOG_SYNC_OPERATIONS=${LOG_SYNC_OPERATIONS:-true}   # true/false - Enable/disable sync logs
      - LOG_HTTP_REQUESTS=${LOG_HTTP_REQUESTS:-false}      # true/false - Enable/disable HTTP logs
      - USE_HOSTNAME_AS_SYNC_KEY=${USE_HOSTNAME_AS_SYNC_KEY:-true}  # true/false - Use host_name instead of instance_id for sync
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opamp-network
    restart: unless-stopped
    # Podman-specific
    userns_mode: keep-id
    security_opt:
      - label=disable

  haproxy:
    image: haproxy:3.2-alpine
    container_name: opamp-haproxy
    depends_on:
      - opamp-server
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,Z
    ports:
      - "4320:4320"       # OpAMP Protocol
      - "8404:8404"       # HAProxy Stats
    networks:
      - opamp-network
    # Podman-specific
    userns_mode: keep-id
    security_opt:
      - label=disable
    ulimits:
      nofile:
        soft: 524288
        hard: 524288

  frontend:
    image: local/opamp-frontend:latest
    container_name: opamp-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      # Empty or relative path - nginx will proxy /api/ to backend
      - VITE_API_URL=
    # Healthcheck disabled - Podman has issues with this format
    #healthcheck:
    #  test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
    #  interval: 30s
    #  timeout: 3s
    #  retries: 3
    networks:
      - opamp-network
    restart: unless-stopped
    # Podman-specific
    userns_mode: keep-id
    security_opt:
      - label=disable

networks:
  opamp-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
