global
  # High connection limit based on system ulimit (524287 FDs / 2)
  maxconn 250000
  tune.ssl.default-dh-param 2048
  log stdout format raw local0
  # HAProxy 3.2 compatible settings
  # Stats socket moved to /tmp for container compatibility
  stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners
  stats timeout 30s
  # Performance tuning for high concurrency
  tune.maxpollevents 300
  tune.bufsize 32768

defaults
  mode tcp
  timeout connect 5s
  timeout client  2m
  timeout server  2m
  # Increased timeout for queue under high load
  timeout queue 30s
  option tcplog
  log global
  # HAProxy 3.2 improvements
  option dontlognull
  retries 3

# Stats frontend for monitoring
frontend stats
  mode http
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
  stats show-legends
  stats show-node
  stats admin if TRUE

frontend fe_opamp
  bind *:4320
  default_backend be_opamp
  # HAProxy 3.2 - better logging
  log-tag opamp-proxy

backend be_opamp
  # Very high connection limit - effectively unlimited
  balance roundrobin
  option tcp-check
  server s1 opamp-server:4320 check fall 2 rise 2 inter 2s
