services:
  postgres:
    image: postgres:16-alpine
    container_name: opamp-postgres
    environment:
      POSTGRES_USER: opamp
      POSTGRES_PASSWORD: opamp_password
      POSTGRES_DB: opamp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opamp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opamp-network

  opamp-server:
    build:
      context: ./opamp-server
    image: local/opamp-server:latest
    container_name: opamp-server    
    command: ["/usr/local/bin/opamp-server"]       
    ports:
      - "4321:4321"  # UI
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:4321/"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - opamp-network

  backend:
    build:
      context: ./backend
    image: local/opamp-backend:latest
    container_name: opamp-backend
    depends_on:
      postgres:
        condition: service_healthy
      opamp-server:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Log configuration (override .env if needed)
      - LOG_LEVEL=${LOG_LEVEL:-INFO}              # DEBUG, INFO, WARNING, ERROR, CRITICAL
      - LOG_SYNC_OPERATIONS=${LOG_SYNC_OPERATIONS:-true}   # true/false - Enable/disable sync logs
      - LOG_HTTP_REQUESTS=${LOG_HTTP_REQUESTS:-false}      # true/false - Enable/disable HTTP logs
      # Agent Sync Strategy
      - USE_HOSTNAME_AS_SYNC_KEY=${USE_HOSTNAME_AS_SYNC_KEY:-true}  # true/false - Use host_name instead of instance_id for sync
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opamp-network
    restart: unless-stopped

  haproxy:
    image: haproxy:3.2-alpine
    container_name: opamp-haproxy
    depends_on:
      - opamp-server
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "4320:4320"       # OpAMP Protocol
      - "8404:8404"       # HAProxy Stats
    networks:
      - opamp-network
    ulimits:
      nofile:
        soft: 524288
        hard: 524288

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: local/opamp-frontend:latest
    container_name: opamp-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      # Empty or relative path - nginx will proxy /api/ to backend
      - VITE_API_URL=
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - opamp-network
    restart: unless-stopped

networks:
  opamp-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
