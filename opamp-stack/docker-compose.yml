services:
  opamp-server:
    build:
      context: ./opamp-server
    image: local/opamp-server:latest
    container_name: opamp-server    
    command: ["/usr/local/bin/opamp-server"]       
    ports:
      - "4321:4321"  # UI
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:4321/"]
      interval: 10s
      timeout: 5s
      retries: 20

  haproxy:
    image: haproxy:2.9
    container_name: opamp-haproxy
    depends_on:
      - opamp-server
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "4320:4320"       # HTTP

