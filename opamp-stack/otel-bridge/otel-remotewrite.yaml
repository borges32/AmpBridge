receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "opamp-status-exporter"
          scrape_interval: 10s
          static_configs:
            - targets: ["opamp-metrics:8000"]   # serviço do python no compose

exporters:
  prometheusremotewrite:
    endpoint: "${REMOTE_WRITE_URL}"
    tls:
      insecure: true
    headers:
      # opcional: auth básica via header Authorization (ou use bearer token)
      # Authorization: "Basic ${REMOTE_WRITE_B64}"
    auth:
      authenticator: basicauth

extensions:
  basicauth:
    client_auth:
      username: "${REMOTE_WRITE_BASIC_AUTH_USER}"
      password: "${REMOTE_WRITE_BASIC_AUTH_PASS}"

service:
  extensions: [basicauth]
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]
